[package]
name = "s2-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Start, stop and chat with local language models, one at a time"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ksni = { version = "0.3.7", default-features = false, features = ["tokio", "blocking"] }
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false }

[dev-dependencies]
tempfile = "3"
